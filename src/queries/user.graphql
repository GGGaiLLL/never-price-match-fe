query Me {
  me {
    id
    name
    email
    createdAt
    updatedAt
  }
}

query CheckEmailExist($email: String!) {
  checkEmailExist(email: $email)
}

query Users {
  users {
    id
    name
    email
    createdAt
    updatedAt
  }
}

query User($id: ID!) {
  user(id: $id) {
    id
    name
    email
    createdAt
    updatedAt
  }
}

mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    name
    email
    createdAt
    updatedAt
  }
}

mutation Login($input: LoginInput!) {
  login(input: $input) {
    ok
    user {
      id
      name
      email
      createdAt
      updatedAt
    }
  }
}

mutation Logout {
  logout
}
